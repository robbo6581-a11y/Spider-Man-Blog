<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebHead | Spider-Man Blog</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #080808;
            --bg-secondary: #141414;
            --bg-tertiary: #1c1c1c;
            --text-primary: #ffffff;
            --text-secondary: #ccc;
            --text-muted: #888;
            --accent: #e00000;
            --accent-light: #ff2929;
            --border-color: #292929;
            --shadow: rgba(230, 0, 0, 0.2);
        }

        html.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #555;
            --text-muted: #999;
            --accent: #cc0000;
            --accent-light: #ff1a1a;
            --border-color: #ddd;
            --shadow: rgba(200, 0, 0, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(224, 0, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(224, 0, 0, 0.1) 0%, transparent 50%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><pattern id="spider-pattern" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse"><g opacity="0.08"><path d="M200 50 L220 100 L240 90 L260 140 L220 160 L240 200 L180 220 L200 280 L160 300 L120 280 L140 220 L80 200 L100 160 L60 140 L80 90 L100 100 Z" fill="none" stroke="%23e00000" stroke-width="8" stroke-linecap="round"/><circle cx="200" cy="180" r="20" fill="none" stroke="%23e00000" stroke-width="8"/></g><g opacity="0.06" transform="translate(200, 200)"><path d="M200 50 L220 100 L240 90 L260 140 L220 160 L240 200 L180 220 L200 280 L160 300 L120 280 L140 220 L80 200 L100 160 L60 140 L80 90 L100 100 Z" fill="none" stroke="%23e00000" stroke-width="8" stroke-linecap="round"/><circle cx="200" cy="180" r="20" fill="none" stroke="%23e00000" stroke-width="8"/></g></pattern></defs><rect width="1200" height="800" fill="%23080808"/><rect width="1200" height="800" fill="url(%23spider-pattern)"/></svg>');
            background-size: 400px 400px;
            background-attachment: fixed;
            background-position: 0 0;
            background-repeat: repeat;
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* HEADER */
        header {
            background: linear-gradient(135deg, #b40000, #e00000);
            padding: 20px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.35);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo::before {
            content: '';
            width: 50px;
            height: 50px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 10 L60 25 L65 20 L70 35 L60 40 L70 50 L55 55 L65 70 L50 75 L35 70 L45 55 L30 50 L40 40 L30 35 L35 20 L40 25 Z" fill="%23ffffff" stroke="%23111" stroke-width="1.5"/><circle cx="50" cy="45" r="8" fill="%23ffffff" stroke="%23111" stroke-width="1"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.5));
        }

        .logo span {
            color: #111;
        }

        .nav-wrapper {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        nav a:hover {
            color: #111;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(20deg);
        }

        /* HERO */
        .hero {
            min-height: 430px;
            padding: 70px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            background:
                radial-gradient(circle at 80% 30%, #e00000 0%, transparent 35%),
                linear-gradient(135deg, #050505, #101a35);
        }

        html.light-mode .hero {
            background:
                radial-gradient(circle at 80% 30%, #ff6b6b 0%, transparent 35%),
                linear-gradient(135deg, #f5f5f5, #e8e8ff);
        }

        .hero-text {
            max-width: 650px;
        }

        .hero h1 {
            font-size: clamp(45px, 7vw, 85px);
            line-height: 0.95;
            margin-bottom: 25px;
        }

        .hero h1 span {
            color: #e00000;
        }

        html.light-mode .hero h1 span {
            color: #cc0000;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 19px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .hero-button {
            display: inline-block;
            background: #e00000;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .hero-button:hover {
            background: #ff2929;
            transform: translateY(-2px);
        }

        .spider {
            font-size: 170px;
            filter: drop-shadow(0 0 30px red);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* MAIN */
        main {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }

        .section-title {
            font-size: 36px;
            margin-bottom: 25px;
            color: var(--text-primary);
        }

        .section-title span {
            color: #e00000;
        }

        /* SEARCH */
        .search-box {
            width: 100%;
            padding: 15px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 35px;
            transition: 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: #e00000;
            box-shadow: 0 0 10px rgba(224, 0, 0, 0.2);
        }

        /* POSTS */
        .posts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .post {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: 0.25s;
            display: flex;
            flex-direction: column;
        }

        .post:hover {
            transform: translateY(-5px);
            border-color: #e00000;
            box-shadow: 0 10px 30px var(--shadow);
        }

        .post-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: var(--bg-tertiary);
        }

        .post-content {
            padding: 22px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .post-date {
            color: #e00000;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .post h3 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .post p {
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-wrap;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        .post-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 6px;
            padding: 10px 14px;
            transition: 0.2s;
        }

        .like-btn {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .like-btn:hover {
            background: #e00000;
            color: white;
            border-color: #e00000;
        }

        .edit-btn {
            background: #164d9b;
            color: white;
        }

        .edit-btn:hover {
            background: #1a5ab8;
        }

        .delete-btn {
            background: #a00000;
            color: white;
        }

        .delete-btn:hover {
            background: #b20000;
        }

        /* CREATE POST */
        .create-section {
            margin-top: 70px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        input,
        textarea {
            width: 100%;
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px;
            border-radius: 7px;
            font-size: 16px;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #e00000;
            box-shadow: 0 0 10px rgba(224, 0, 0, 0.2);
        }

        textarea {
            min-height: 180px;
            resize: vertical;
            font-family: inherit;
        }

        .image-preview {
            margin-top: 15px;
            max-width: 300px;
            max-height: 200px;
            display: none;
            border-radius: 8px;
            object-fit: cover;
        }

        .publish-btn {
            background: #e00000;
            color: white;
            padding: 14px 25px;
            font-size: 16px;
        }

        .publish-btn:hover {
            background: #ff2525;
        }

        .cancel-btn {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 14px 25px;
            font-size: 16px;
            display: none;
            margin-left: 8px;
            border: 1px solid var(--border-color);
        }

        .cancel-btn:hover {
            background: var(--border-color);
        }

        /* EMPTY */
        .empty {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-secondary);
            border-radius: 12px;
            color: var(--text-muted);
            border: 2px dashed var(--border-color);
        }

        .empty h3 {
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        /* FOOTER */
        footer {
            margin-top: 80px;
            background: var(--bg-secondary);
            border-top: 2px solid var(--border-color);
            text-align: center;
            padding: 35px;
            color: var(--text-muted);
        }

        footer strong {
            color: #e00000;
        }

        /* MOBILE */
        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 12px;
            }

            .nav-wrapper {
                width: 100%;
                justify-content: space-between;
            }

            nav a {
                margin: 0;
                font-size: 14px;
            }

            .hero {
                text-align: center;
                justify-content: center;
            }

            .spider {
                display: none;
            }

            .create-section {
                padding: 20px;
            }

            .posts {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">WEB<span>HEAD</span></div>

    <div class="nav-wrapper">
        <nav>
            <a href="#posts">Posts</a>
            <a href="#create">Create Post</a>
        </nav>
        <button class="theme-toggle" id="themeToggle" title="Toggle Light/Dark Mode">🌙</button>
    </div>
</header>

<section class="hero">
    <div class="hero-text">
        <h1>
            THE <span>SPIDER-MAN</span><br>
            BLOG
        </h1>

        <p>
            Your place for Spider-Man news, theories, comic discussions,
            movie reviews, fan art and everything web-slinging.
        </p>

        <a href="#create" class="hero-button">
            Create a Post
        </a>
    </div>

    <div class="spider">
        🕷️
    </div>
</section>


<main>

    <!-- POSTS -->
    <section id="posts">
        <h2 class="section-title">
            Latest <span>Posts</span>
        </h2>

        <input
            type="text"
            id="search"
            class="search-box"
            placeholder="Search posts by title or content..."
        >

        <div id="postsContainer" class="posts"></div>
    </section>


    <!-- CREATE POST -->
    <section id="create" class="create-section">

        <h2 class="section-title">
            Create a <span>New Post</span>
        </h2>

        <form id="postForm">

            <div class="form-group">
                <label for="title">Post Title</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter your post title..."
                    required
                >
            </div>


            <div class="form-group">
                <label for="content">Post Content</label>

                <textarea
                    id="content"
                    placeholder="Write your Spider-Man post..."
                    required
                ></textarea>
            </div>


            <div class="form-group">
                <label for="image">
                    Add an Image
                </label>

                <input
                    type="file"
                    id="image"
                    accept="image/*"
                >

                <img
                    id="imagePreview"
                    class="image-preview"
                    alt="Image preview"
                >
            </div>


            <button
                type="submit"
                class="publish-btn"
                id="publishButton"
            >
                Publish Post
            </button>

            <button
                type="button"
                class="cancel-btn"
                id="cancelButton"
            >
                Cancel Edit
            </button>

        </form>

    </section>

</main>


<footer>
    <p>
        WEBHEAD — A fan-made Spider-Man blog
    </p>
</footer>


<script>

    let posts = JSON.parse(
        localStorage.getItem("spidermanPosts")
    ) || [];

    let editingId = null;
    let selectedImage = "";


    /*
    ---------------------------
    THEME TOGGLE
    ---------------------------
    */

    const themeToggle = document.getElementById("themeToggle");
    const html = document.documentElement;

    function initTheme() {
        const savedTheme = localStorage.getItem("theme") || "dark";
        if (savedTheme === "light") {
            html.classList.add("light-mode");
            themeToggle.textContent = "🌞";
        } else {
            html.classList.remove("light-mode");
            themeToggle.textContent = "🌙";
        }
    }

    themeToggle.addEventListener("click", function() {
        html.classList.toggle("light-mode");
        const theme = html.classList.contains("light-mode") ? "light" : "dark";
        localStorage.setItem("theme", theme);
        themeToggle.textContent = theme === "light" ? "🌞" : "🌙";
    });

    initTheme();


    /*
    ---------------------------
    IMAGE SELECTION
    ---------------------------
    */

    const imageInput =
        document.getElementById("image");

    const imagePreview =
        document.getElementById("imagePreview");


    imageInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (event) {

            selectedImage = event.target.result;

            imagePreview.src = selectedImage;
            imagePreview.style.display = "block";

        };

        reader.readAsDataURL(file);

    });


    /*
    ---------------------------
    SAVE POSTS
    ---------------------------
    */

    function savePosts() {

        localStorage.setItem(
            "spidermanPosts",
            JSON.stringify(posts)
        );

    }


    /*
    ---------------------------
    DISPLAY POSTS
    ---------------------------
    */

    function displayPosts(searchTerm = "") {

        const container =
            document.getElementById("postsContainer");

        container.innerHTML = "";

        const filteredPosts = posts.filter(post => {

            return (
                post.title
                    .toLowerCase()
                    .includes(searchTerm.toLowerCase()) ||

                post.content
                    .toLowerCase()
                    .includes(searchTerm.toLowerCase())
            );

        });


        if (filteredPosts.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h3>No posts found</h3>
                    <p>Create your first Spider-Man post!</p>
                </div>
            `;

            return;
        }


        filteredPosts.forEach(post => {

            const article =
                document.createElement("article");

            article.className = "post";


            const imageHTML = post.image
                ? `<img
                        src="${post.image}"
                        class="post-image"
                        alt="${escapeHTML(post.title)}"
                   >`
                : `<div
                        class="post-image"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:70px;
                        "
                   >
                        🕷️
                   </div>`;


            article.innerHTML = `

                ${imageHTML}

                <div class="post-content">

                    <div class="post-date">
                        ${post.date}
                    </div>

                    <h3>
                        ${escapeHTML(post.title)}
                    </h3>

                    <p>
                        ${escapeHTML(post.content)}
                    </p>

                    <div class="post-actions">

                        <button
                            class="like-btn"
                            onclick="likePost(${post.id})"
                        >
                            ❤️ ${post.likes}
                        </button>

                        <button
                            class="edit-btn"
                            onclick="editPost(${post.id})"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deletePost(${post.id})"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>
            `;


            container.appendChild(article);

        });

    }


    /*
    ---------------------------
    CREATE / EDIT POST
    ---------------------------
    */

    document
        .getElementById("postForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const title =
                document.getElementById("title").value.trim();

            const content =
                document.getElementById("content").value.trim();


            if (!title || !content) {

                alert("Please enter a title and content.");

                return;
            }


            if (editingId !== null) {

                const post =
                    posts.find(p => p.id === editingId);


                post.title = title;
                post.content = content;


                if (selectedImage) {
                    post.image = selectedImage;
                }


                editingId = null;

                document.getElementById(
                    "publishButton"
                ).textContent = "Publish Post";

                document.getElementById(
                    "cancelButton"
                ).style.display = "none";

            } else {

                const newPost = {

                    id: Date.now(),

                    title: title,

                    content: content,

                    image: selectedImage,

                    likes: 0,

                    date: new Date().toLocaleDateString(
                        "en-IE",
                        {
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }
                    )

                };


                posts.unshift(newPost);

            }


            savePosts();

            displayPosts();

            this.reset();

            selectedImage = "";

            imagePreview.style.display = "none";

            imagePreview.src = "";

            window.location.hash = "posts";

        });


    /*
    ---------------------------
    LIKE POST
    ---------------------------
    */

    function likePost(id) {

        const post =
            posts.find(p => p.id === id);

        if (!post) return;

        post.likes++;

        savePosts();

        displayPosts(
            document.getElementById("search").value
        );

    }


    /*
    ---------------------------
    DELETE POST
    ---------------------------
    */

    function deletePost(id) {

        const confirmed =
            confirm("Delete this Spider-Man post?");

        if (!confirmed) return;


        posts = posts.filter(
            post => post.id !== id
        );

        savePosts();

        displayPosts();

    }


    /*
    ---------------------------
    EDIT POST
    ---------------------------
    */

    function editPost(id) {

        const post =
            posts.find(p => p.id === id);

        if (!post) return;


        editingId = id;


        document.getElementById(
            "title"
        ).value = post.title;


        document.getElementById(
            "content"
        ).value = post.content;


        selectedImage = post.image || "";


        if (post.image) {

            imagePreview.src = post.image;

            imagePreview.style.display = "block";

        }


        document.getElementById(
            "publishButton"
        ).textContent = "Save Changes";


        document.getElementById(
            "cancelButton"
        ).style.display = "inline-block";


        document
            .getElementById("create")
            .scrollIntoView({
                behavior: "smooth"
            });

    }


    /*
    ---------------------------
    CANCEL EDIT
    ---------------------------
    */

    document
        .getElementById("cancelButton")
        .addEventListener("click", function() {

            editingId = null;

            document
                .getElementById("postForm")
                .reset();

            selectedImage = "";

            imagePreview.style.display = "none";

            imagePreview.src = "";

            document.getElementById(
                "publishButton"
            ).textContent = "Publish Post";

            this.style.display = "none";

        });


    /*
    ---------------------------
    SEARCH
    ---------------------------
    */

    document
        .getElementById("search")
        .addEventListener("input", function() {

            displayPosts(this.value);

        });


    /*
    ---------------------------
    SECURITY
    ---------------------------
    */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /*
    ---------------------------
    INITIAL LOAD
    ---------------------------
    */

    displayPosts();

</script>

</body>
</html>
